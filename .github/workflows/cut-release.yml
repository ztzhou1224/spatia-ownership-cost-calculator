# Cut a release BY HAND only (owner, 2026-11-19: "Cut a release" / "Can't you do that?"): Actions -> Cut release -> Run workflow.
# It tags the branch head vYYYY.MM.DD (or the tag given), creates the GitHub release with notes from the commits since the last
# release, then builds and deploys the Worker to cost.runspatia.com when the repository has the secrets CLOUDFLARE_ALL_IN_ONE and
# CLOUDFLARE_ACCOUNT_ID (as Home and Crime); without them the deploy step is skipped with a note. It runs no tests: the gate
# (pnpm test, pnpm build) runs before a push. The Worker's own secrets stay on Cloudflare. No push, pull request or schedule trigger.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (empty: vYYYY.MM.DD of today, UTC)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-v$(date -u +%Y.%m.%d)}"
          if ! [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then echo "::error::tag must look like vYYYY.MM.DD[.N]"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::tag $tag already exists"; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          echo "Released $tag at $GITHUB_SHA"
      - name: Check the deploy secrets
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_ALL_IN_ONE }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Deploy skipped: add the repository secrets CLOUDFLARE_ALL_IN_ONE and CLOUDFLARE_ACCOUNT_ID"; echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.deploy == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Build and deploy
        if: steps.secrets.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ALL_IN_ONE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec wrangler deploy --message "release ${{ inputs.tag || 'today' }} ($GITHUB_SHA)"
